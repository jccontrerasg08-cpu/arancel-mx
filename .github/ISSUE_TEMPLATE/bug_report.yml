name: Reporte de error
description: Reporta un problema reproducible del paquete o los datos arancelarios.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "No publiques credenciales, datos personales ni vulnerabilidades. Para seguridad, usa Security Advisories."
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - Fuente o captura
        - Parser
        - Modelo o normalización
        - Almacenamiento o pipeline
        - Release o CLI
        - Documentación
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Descripción
      description: Explica qué ocurrió y qué esperabas.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Pasos para reproducir
      description: Incluye un ejemplo mínimo, fixture sanitizado o comando exacto.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Versión o commit
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: Evidencia y procedencia
      description: Para datos, incluye autoridad, URL oficial, fecha y hash si está disponible.
