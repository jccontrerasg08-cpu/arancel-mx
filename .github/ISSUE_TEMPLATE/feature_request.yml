name: Propuesta de mejora
description: Sugiere una mejora concreta dentro del alcance arancelario.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - Fuente oficial
        - Parser o fixture
        - Modelo de datos
        - Validación o conciliación
        - Release o CLI
        - Documentación
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: Necesidad
      description: ¿Qué problema público y verificable resolvería?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Propuesta
      description: Describe el comportamiento esperado y sus límites.
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: Fuentes y procedencia
      description: Para cambios de datos, incluye autoridad, URL, versión, fecha y términos aplicables.
