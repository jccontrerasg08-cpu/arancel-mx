name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # GitHub Rulesets require the check-run context `test`; renaming this job breaks
  # the required status check documented in docs/operations/github-settings.md.
  test:
    runs-on: ubuntu-latest
    # Live official-source probes may consume several 45-second retries; keep the
    # job longer than that bounded gate so a failed endpoint is reported, not cancelled.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/production-build.txt

      - name: Install package and development tools
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -c requirements/production-build.txt -e ".[dev]"

      - name: Lint with Ruff
        run: python -m ruff check src tests scripts

      - name: Type-check full package
        run: python -m mypy src/arancel_mx

      - name: Run tests
        env:
          ARANCEL_MX_SKIP_URL_CHECKS: "1"
        run: python -m pytest -q --cov=arancel_mx --cov-report=term-missing

      - name: Verify documented official URLs are accessible
        run: |
          python -m scripts.check_documented_urls --timeout 15
          python -m scripts.validate_ligie_html_pages --timeout 15

      - name: Build distributions
        run: python -m build

      - name: Build DuckDB compatibility fixture
        run: |
          rm -rf /tmp/arancel-duckdb-compat-warehouse.duckdb /tmp/arancel-duckdb-compat-release
          python - <<'PY'
          from datetime import date, datetime
          from pathlib import Path

          from arancel_mx.pipeline.build import export_arancel_release, materialize_arancel
          from arancel_mx.storage.duckdb import connect, init_tariff_db

          warehouse = init_tariff_db(Path("/tmp/arancel-duckdb-compat-warehouse.duckdb"))
          release_metadata = {
              "registry_version": "compatibility-probe",
              "registry_sha256": "b" * 64,
              "git_commit_sha": "compatibility-probe",
              "github_run_id": "compatibility-probe",
              "github_run_attempt": "1",
              "github_workflow_ref": "compatibility-probe",
              "github_artifact_name": "compatibility-probe",
              "reconciliation": {
                  "publishable": True,
                  "error_codes": [],
                  "discrepancies": [],
                  "legal_document_ids": [],
                  "proposal_document_ids": [],
                  "indicator_document_ids": [],
              },
              "source_identity": [],
          }
          release = {
              "dataset_version": "compatibility-probe",
              "schema_version": "2",
              "ligie_version": "compatibility-probe",
              "effective_as_of": date(2026, 1, 1),
              "generated_at": datetime(2026, 1, 1),
              "release_metadata": release_metadata,
          }
          with connect(warehouse) as connection:
              materialize_arancel(connection, [], [], [], release)
          export_arancel_release(warehouse, Path("/tmp/arancel-duckdb-compat-release"))
          PY

      - name: Verify DuckDB 1.1.0 compatibility
        run: |
          rm -rf /tmp/arancel-duckdb-1.1.0
          python -m venv /tmp/arancel-duckdb-1.1.0
          /tmp/arancel-duckdb-1.1.0/bin/python -m pip install pip==26.2.1
          /tmp/arancel-duckdb-1.1.0/bin/python -m pip install duckdb==1.1.0
          /tmp/arancel-duckdb-1.1.0/bin/python scripts/check_duckdb_compat.py \
            /tmp/arancel-duckdb-compat-release/arancel_mx.duckdb \
            --expected-row-count 0

      - name: Smoke-test built distributions
        run: |
          python scripts/certify_package_install.py dist/*.whl
          python scripts/certify_package_install.py dist/*.tar.gz

      # --exit-code makes this fail on any modification, not only on a whitespace
      # error inside one: on a clean checkout the tests and build must leave every
      # tracked file untouched.
      - name: Verify the build left tracked files unchanged
        run: git diff --check --exit-code

  fastapi-cloud-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up FastAPI Cloud Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: requirements/production-build.txt

      - name: Install FastAPI Cloud runtime test dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -c requirements/production-build.txt -e "." pytest==9.1.1 httpx2==2.9.0

      - name: Smoke-test FastAPI Cloud runtime
        env:
          ARANCEL_MX_SKIP_URL_CHECKS: "1"
        run: python -m pytest -q tests/api tests/package/test_api_install_smoke.py

      - name: Smoke-test default FastAPI startup
        env:
          ARANCEL_MX_API_DATASET: data-2026.08.15
          ARANCEL_MX_CACHE_DIR: "${{ runner.temp }}/arancel-mx-api-cache"
          ARANCEL_MX_GITHUB_TOKEN: "${{ github.token }}"
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from arancel_mx.api.app import app

          with TestClient(app) as client:
              ready = client.get("/readyz")
              assert ready.status_code == 200, ready.text
              meta = client.get("/v1/meta")
              assert meta.status_code == 200, meta.text
              payload = meta.json()
              assert payload["dataset_tag"] == "data-2026.08.15"
              assert payload["release_verified"] is True
              assert payload["structural_valid"] is True
              notes = client.get("/v1/chapters/85/national-notes")
              assert notes.status_code == 200, notes.text
              notes_payload = notes.json()
              assert notes_payload, "expected chapter 85 national notes in data-2026.08.15"
              assert all(note["scope_type"] is None for note in notes_payload)
              assert all(note["scope_value"] is None for note in notes_payload)
              assert all(
                  note["applicability_basis"] == "unresolved" for note in notes_payload
              )
          PY


  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: requirements/production-build.txt

      - name: Install application
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -c requirements/production-build.txt -e .

      - name: Seed verified browser-test dataset
        env:
          ARANCEL_MX_CACHE_DIR: /tmp/arancel-mx-playwright-cache
          ARANCEL_MX_DATASET: data-2026.08.15
          ARANCEL_MX_GITHUB_TOKEN: ${{ github.token }}
        run: arancel-mx data download

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install browser test dependencies
        run: npm ci

      - name: Install Chromium
        # GitHub-hosted Ubuntu already provides the shared libraries required by Chromium.
        # Avoid --with-deps: its apt mirror fetch can stall before the browser suite starts.
        run: npx playwright install chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Upload browser-test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
