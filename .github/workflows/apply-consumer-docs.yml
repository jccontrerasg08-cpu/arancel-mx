name: Apply consumer README sections

on:
  push:
    branches:
      - feat/pypi-consumer-cli
    paths:
      - .github/workflows/apply-consumer-docs.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/pypi-consumer-cli
      - name: Replace consumer documentation sections
        run: python scripts/_apply_consumer_docs.py
      - name: Commit README updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "docs: document consumer CLI and diagnostics"
          git push origin HEAD:feat/pypi-consumer-cli
