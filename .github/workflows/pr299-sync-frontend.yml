name: PR 299 one-shot frontend sync

on:
  push:
    branches:
      - feat/trade-storytelling
    paths:
      - .github/workflows/pr299-sync-frontend.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/trade-storytelling
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact frontend dependencies
        run: npm ci

      - name: Rebuild committed frontend
        run: npm run build:frontend

      - name: Verify generated frontend contracts
        run: |
          node --test tests/e2e/frontend-*.test.mjs tests/e2e/set-site-origin.test.mjs tests/e2e/lighthouse-check.test.mjs
          git diff --check
          git diff --exit-code -- frontend package.json package-lock.json

      - name: Commit generated artifacts and remove this one-shot workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if git diff --quiet -- src/arancel_mx/api/static/site; then
            echo "Expected generated static-site changes, but build produced none." >&2
            exit 1
          fi
          git rm .github/workflows/pr299-sync-frontend.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/arancel_mx/api/static/site .github/workflows/pr299-sync-frontend.yml
          git commit -m "build: sync frontend static assets"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/feat/trade-storytelling
