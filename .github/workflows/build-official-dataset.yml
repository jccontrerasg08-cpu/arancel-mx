name: Build official dataset

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run offline regression tests
        run: python -m pytest -q

      - name: Resolve UTC build metadata
        id: metadata
        shell: bash
        run: |
          echo "effective_as_of=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "dataset_version=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
          echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build from registered official sources
        run: |
          python scripts/build_official_dataset.py \
            --work-dir data/embedded/official-build \
            --output-dir out/release \
            --effective-as-of "${{ steps.metadata.outputs.effective_as_of }}" \
            --dataset-version "${{ steps.metadata.outputs.dataset_version }}" \
            --generated-at "${{ steps.metadata.outputs.generated_at }}"

      - name: Verify canonical release manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("out/release/manifest.json").read_text(encoding="utf-8"))
          assert manifest["validation_status"] == "passed"
          assert int(manifest["row_count"]) > 0
          assert manifest["source_documents"]
          assert all(item.get("source_url") for item in manifest["source_documents"])
          assert all(len(item.get("sha256", "")) == 64 for item in manifest["source_documents"])
          assert all("local_path" not in item for item in manifest["source_documents"])
          PY

      - name: Upload verified dataset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: arancel-mx-${{ github.run_id }}
          path: out/release/
          if-no-files-found: error
          retention-days: 30
