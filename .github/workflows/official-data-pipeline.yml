name: Official data pipeline

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish verified changed data"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: read

concurrency:
  group: arancel-mx-official-data-production
  cancel-in-progress: false

jobs:
  build-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      status: ${{ steps.pipeline_result.outputs.status }}
      stage: ${{ steps.pipeline_result.outputs.stage }}
      dataset_version: ${{ steps.pipeline_result.outputs.dataset_version }}
      failure_category: ${{ steps.pipeline_result.outputs.failure_category }}
      message: ${{ steps.pipeline_result.outputs.message }}
      artifact_name: ${{ steps.pipeline_result.outputs.artifact_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/production-build.txt

      - name: Install exact production environment
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -c requirements/production-build.txt -e ".[dev]"

      - name: Run offline tests before source access
        id: tests
        run: python -m pytest -q

      - name: Resolve UTC dataset version and provenance
        id: metadata
        run: |
          dataset_date="$(date -u +%Y-%m-%d)"
          dataset_version="${dataset_date//-/.}"
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          artifact_name="arancel-mx-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "DATASET_DATE=${dataset_date}" >> "$GITHUB_ENV"
          echo "DATASET_VERSION=${dataset_version}" >> "$GITHUB_ENV"
          echo "GENERATED_AT=${generated_at}" >> "$GITHUB_ENV"
          echo "ARANCEL_MX_ARTIFACT_NAME=${artifact_name}" >> "$GITHUB_ENV"

      - name: Fetch previous published dataset manifest
        id: previous
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          python -m scripts.fetch_previous_release --output out/previous-manifest.json

      - name: Record previous-release lookup failure
        if: steps.previous.outcome == 'failure'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = {
              "status": "failed",
              "stage": "previous_release",
              "dataset_version": "${{ env.DATASET_VERSION }}",
              "failure_category": "previous_release_lookup",
              "message": "previous published dataset lookup failed; inspect the workflow run logs",
          }
          Path("out").mkdir(exist_ok=True)
          Path("out/pipeline-result.json").write_text(
              json.dumps(result, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Run fail-closed official data pipeline
        id: pipeline
        if: steps.previous.outcome == 'success'
        continue-on-error: true
        env:
          ARANCEL_MX_ARTIFACT_NAME: ${{ env.ARANCEL_MX_ARTIFACT_NAME }}
        run: |
          python scripts/run_official_pipeline.py \
            --work-dir out/work \
            --output-dir out/release \
            --effective-as-of "$DATASET_DATE" \
            --dataset-version "$DATASET_VERSION" \
            --generated-at "$GENERATED_AT" \
            --previous-manifest out/previous-manifest.json \
            --result-path out/pipeline-result.json

      - name: Extract bounded pipeline diagnostics
        id: pipeline_result
        if: always()
        env:
          ARTIFACT_NAME: arancel-mx-${{ github.run_id }}-${{ github.run_attempt }}
          FALLBACK_VERSION: ${{ env.DATASET_VERSION }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("out/pipeline-result.json")
          if path.is_file():
              try:
                  result = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  result = {}
          else:
              result = {}
          if not isinstance(result, dict) or not result:
              result = {
                  "status": "failed",
                  "stage": "preflight",
                  "dataset_version": os.environ.get("FALLBACK_VERSION") or "unknown",
                  "failure_category": "preflight_failure",
                  "message": "workflow failed before structured pipeline diagnostics were available; inspect the run logs",
              }
          message = " ".join(str(result.get("message") or "").split())[:800]
          values = {
              "status": str(result.get("status") or "failed"),
              "stage": str(result.get("stage") or "unknown"),
              "dataset_version": str(result.get("dataset_version") or os.environ.get("FALLBACK_VERSION") or "unknown"),
              "failure_category": str(result.get("failure_category") or "unknown_error"),
              "message": message,
              "artifact_name": str(result.get("artifact_name") or os.environ["ARTIFACT_NAME"]),
          }
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as stream:
              for key, value in values.items():
                  stream.write(f"{key}={value}\n")
          PY

      - name: Upload verified changed bundle
        if: steps.pipeline_result.outputs.status == 'built' && steps.pipeline.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arancel-mx-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/release/
          if-no-files-found: error
          retention-days: 30

      - name: Fail after diagnostics are exposed
        if: always() && (steps.previous.outcome == 'failure' || steps.pipeline.outcome == 'failure' || steps.pipeline_result.outputs.status == 'failed')
        run: exit 1

  publish:
    needs: build-and-verify
    if: >-
      needs.build-and-verify.result == 'success' &&
      needs.build-and-verify.outputs.status == 'built' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || inputs.publish == true)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      status: ${{ steps.publisher_result.outputs.status }}
      stage: ${{ steps.publisher_result.outputs.stage }}
      failure_category: ${{ steps.publisher_result.outputs.failure_category }}
      message: ${{ steps.publisher_result.outputs.message }}
    steps:
      - name: Check out exact validated commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/production-build.txt

      - name: Install exact production environment
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -c requirements/production-build.txt -e ".[dev]"

      - name: Download exact verified build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arancel-mx-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/release

      - name: Independently verify publication bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          from arancel_mx.release import verify_publication_bundle

          verify_publication_bundle(Path("out/release"))
          PY

      - name: Publish immutable verified release
        id: publisher
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          python -m scripts.publish_release \
            --release-dir out/release \
            --commit-sha "$GITHUB_SHA" \
            --result-path out/publisher-result.json

      - name: Extract bounded publisher diagnostics
        id: publisher_result
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("out/publisher-result.json")
          try:
              result = json.loads(path.read_text(encoding="utf-8")) if path.is_file() else {}
          except Exception:
              result = {}
          if not isinstance(result, dict) or not result:
              result = {
                  "status": "failed",
                  "stage": "publish",
                  "failure_category": "publisher_failure",
                  "message": "publisher failed without structured diagnostics; inspect the workflow run logs",
              }
          values = {
              "status": str(result.get("status") or "failed"),
              "stage": str(result.get("stage") or ("complete" if result.get("status") == "published" else "publish")),
              "failure_category": str(result.get("failure_category") or ""),
              "message": " ".join(str(result.get("message") or "").split())[:800],
          }
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as stream:
              for key, value in values.items():
                  stream.write(f"{key}={value}\n")
          PY

      - name: Fail after publisher diagnostics are exposed
        if: always() && (steps.publisher.outcome == 'failure' || steps.publisher_result.outputs.status == 'failed')
        run: exit 1

  notify:
    needs: [build-and-verify, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out exact workflow commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/production-build.txt

      - name: Install exact production environment
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -c requirements/production-build.txt -e ".[dev]"

      - name: Dry-run notification boundary
        if: github.ref != 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.publish != true)
        run: echo "Dry run complete; GitHub issue mutation is disabled."

      - name: Upsert build failure alert
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' || inputs.publish == true) &&
          needs.build-and-verify.result == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALERT_STATUS: failed
          ALERT_STAGE: ${{ needs.build-and-verify.outputs.stage }}
          ALERT_VERSION: ${{ needs.build-and-verify.outputs.dataset_version }}
          ALERT_CATEGORY: ${{ needs.build-and-verify.outputs.failure_category }}
          ALERT_MESSAGE: ${{ needs.build-and-verify.outputs.message }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "status": "failed",
              "stage": os.environ.get("ALERT_STAGE") or "build",
              "dataset_version": os.environ.get("ALERT_VERSION") or "unknown",
              "failure_category": os.environ.get("ALERT_CATEGORY") or "build_failure",
              "message": os.environ.get("ALERT_MESSAGE") or "build failed; inspect the workflow run logs",
          }
          Path("out").mkdir(exist_ok=True)
          Path("out/alert-result.json").write_text(json.dumps(payload) + "\n", encoding="utf-8")
          PY
          python -m scripts.data_alert failure --result out/alert-result.json

      - name: Upsert publication failure alert
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' || inputs.publish == true) &&
          needs.build-and-verify.result == 'success' &&
          needs.build-and-verify.outputs.status == 'built' &&
          needs.publish.result == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALERT_STAGE: ${{ needs.publish.outputs.stage }}
          ALERT_VERSION: ${{ needs.build-and-verify.outputs.dataset_version }}
          ALERT_CATEGORY: ${{ needs.publish.outputs.failure_category }}
          ALERT_MESSAGE: ${{ needs.publish.outputs.message }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "status": "failed",
              "stage": os.environ.get("ALERT_STAGE") or "publish",
              "dataset_version": os.environ.get("ALERT_VERSION") or "unknown",
              "failure_category": os.environ.get("ALERT_CATEGORY") or "release_publication",
              "message": os.environ.get("ALERT_MESSAGE") or "publication failed; inspect the workflow run logs",
          }
          Path("out").mkdir(exist_ok=True)
          Path("out/alert-result.json").write_text(json.dumps(payload) + "\n", encoding="utf-8")
          PY
          python -m scripts.data_alert failure --result out/alert-result.json

      - name: Close recovered automation alerts
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' || inputs.publish == true) &&
          needs.build-and-verify.result == 'success' &&
          ((needs.build-and-verify.outputs.status == 'no_change' && needs.publish.result == 'skipped') ||
           needs.publish.result == 'success')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.data_alert recovery
