name: Official data pipeline

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish verified changed data"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: read

concurrency:
  group: arancel-mx-official-data-production
  cancel-in-progress: false

jobs:
  build-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      status: ${{ steps.pipeline_result.outputs.status }}
      stage: ${{ steps.pipeline_result.outputs.stage }}
      dataset_version: ${{ steps.pipeline_result.outputs.dataset_version }}
      failure_category: ${{ steps.pipeline_result.outputs.failure_category }}
      message: ${{ steps.pipeline_result.outputs.message }}
      artifact_name: ${{ steps.pipeline_result.outputs.artifact_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # This job parses untrusted official documents; keep the token out of .git/config.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/production-build.txt

      - name: Install exact production environment
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -c requirements/production-build.txt -e ".[dev]"

      - name: Run offline tests before source access
        id: tests
        run: python -m pytest -q

      - name: Resolve UTC dataset version and provenance
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          dataset_date="$(date -u +%Y-%m-%d)"
          {
            echo "DATASET_DATE=${dataset_date}"
            echo "DATASET_VERSION=${dataset_date//-/.}"
            echo "GENERATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "ARANCEL_MX_ARTIFACT_NAME=arancel-mx-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_ENV"

      - name: Fetch previous published dataset manifest
        id: previous
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          python -m scripts.fetch_previous_release --output out/previous-manifest.json

      - name: Record previous-release lookup failure
        if: steps.previous.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.workflow_diagnostics write-failure \
            --path out/pipeline-result.json \
            --stage previous_release \
            --failure-category previous_release_lookup \
            --dataset-version "${DATASET_VERSION:-}" \
            --message "previous published dataset lookup failed; inspect the workflow run logs"

      - name: Run fail-closed official data pipeline
        id: pipeline
        if: steps.previous.outcome == 'success'
        continue-on-error: true
        run: |
          python scripts/run_official_pipeline.py \
            --work-dir out/work \
            --output-dir out/release \
            --effective-as-of "$DATASET_DATE" \
            --dataset-version "$DATASET_VERSION" \
            --generated-at "$GENERATED_AT" \
            --previous-manifest out/previous-manifest.json \
            --result-path out/pipeline-result.json

      - name: Extract bounded pipeline diagnostics
        id: pipeline_result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.workflow_diagnostics pipeline-outputs \
            --result out/pipeline-result.json \
            --dataset-version "${DATASET_VERSION:-}" \
            --artifact-name "${ARANCEL_MX_ARTIFACT_NAME:-arancel-mx-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"

      - name: Upload verified changed bundle
        if: steps.pipeline_result.outputs.status == 'built' && steps.pipeline.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arancel-mx-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/release/
          if-no-files-found: error
          retention-days: 30

      - name: Fail after diagnostics are exposed
        if: always() && (steps.previous.outcome == 'failure' || steps.pipeline.outcome == 'failure' || steps.pipeline_result.outputs.status == 'failed')
        run: exit 1

  publish:
    needs: build-and-verify
    if: >-
      needs.build-and-verify.result == 'success' &&
      needs.build-and-verify.outputs.status == 'built' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || inputs.publish == true)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write # only this job may create the immutable release for a tag
      attestations: write # sign SLSA provenance for the six public assets
      id-token: write # mint the short-lived OIDC identity attestation requires
    outputs:
      status: ${{ steps.publisher_result.outputs.status }}
      stage: ${{ steps.publisher_result.outputs.stage }}
      failure_category: ${{ steps.publisher_result.outputs.failure_category }}
      message: ${{ steps.publisher_result.outputs.message }}
    steps:
      - name: Check out exact validated commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          # Publication and attestation use explicit token env vars, never git credentials.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/production-build.txt

      - name: Install exact production runtime
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -c requirements/production-build.txt -e .

      - name: Download exact verified build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arancel-mx-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/release

      - name: Independently certify publication bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          from arancel_mx.certification import certify_bundle

          report = certify_bundle(Path("out/release"))
          if not report.passed:
              raise SystemExit("publication bundle certification failed")
          PY

      # Passing no predicate input selects the action's SLSA build provenance mode,
      # and leaving push-to-registry false means no storage record is created, so
      # the two permissions above are the complete set this step needs.
      - name: Generate build provenance attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            out/release/arancel_mx.duckdb
            out/release/arancel_mx.csv
            out/release/arancel_mx.json
            out/release/manifest.json
            out/release/SHA256SUMS
            out/release/official-sources.tar.gz

      - name: Verify build provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "arancel_mx.duckdb"
            "arancel_mx.csv"
            "arancel_mx.json"
            "manifest.json"
            "SHA256SUMS"
            "official-sources.tar.gz"
          )
          for asset in "${assets[@]}"; do
            gh attestation verify "out/release/${asset}" \
              --repo jccontrerasg08-cpu/arancel-mx \
              --signer-workflow jccontrerasg08-cpu/arancel-mx/.github/workflows/official-data-pipeline.yml
          done

      - name: Publish immutable verified release
        id: publisher
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          python -m scripts.publish_release \
            --release-dir out/release \
            --commit-sha "$GITHUB_SHA" \
            --result-path out/publisher-result.json

      - name: Extract bounded publisher diagnostics
        id: publisher_result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.workflow_diagnostics publisher-outputs \
            --result out/publisher-result.json

      - name: Fail after publisher diagnostics are exposed
        if: always() && (steps.publisher.outcome == 'failure' || steps.publisher_result.outputs.status == 'failed')
        run: exit 1

  notify:
    needs: [build-and-verify, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # only this job may open, update, or close the automation alert
    steps:
      - name: Check out exact workflow commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Alerting uses the REST API through an explicit token env var.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/production-build.txt

      - name: Install exact production runtime
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -c requirements/production-build.txt -e .

      - name: Dry-run notification boundary
        if: github.ref != 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.publish != true)
        run: echo "Dry run complete; GitHub issue mutation is disabled."

      - name: Upsert build failure alert
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' || inputs.publish == true) &&
          needs.build-and-verify.result == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALERT_STAGE: ${{ needs.build-and-verify.outputs.stage }}
          ALERT_VERSION: ${{ needs.build-and-verify.outputs.dataset_version }}
          ALERT_CATEGORY: ${{ needs.build-and-verify.outputs.failure_category }}
          ALERT_MESSAGE: ${{ needs.build-and-verify.outputs.message }}
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.workflow_diagnostics write-failure \
            --path out/alert-result.json \
            --stage "${ALERT_STAGE:-build}" \
            --failure-category "${ALERT_CATEGORY:-build_failure}" \
            --dataset-version "${ALERT_VERSION:-}" \
            --message "${ALERT_MESSAGE:-build failed; inspect the workflow run logs}"
          python -m scripts.data_alert failure --result out/alert-result.json

      - name: Upsert publication failure alert
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' || inputs.publish == true) &&
          needs.build-and-verify.result == 'success' &&
          needs.build-and-verify.outputs.status == 'built' &&
          needs.publish.result == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALERT_STAGE: ${{ needs.publish.outputs.stage }}
          ALERT_VERSION: ${{ needs.build-and-verify.outputs.dataset_version }}
          ALERT_CATEGORY: ${{ needs.publish.outputs.failure_category }}
          ALERT_MESSAGE: ${{ needs.publish.outputs.message }}
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.workflow_diagnostics write-failure \
            --path out/alert-result.json \
            --stage "${ALERT_STAGE:-publish}" \
            --failure-category "${ALERT_CATEGORY:-release_publication}" \
            --dataset-version "${ALERT_VERSION:-}" \
            --message "${ALERT_MESSAGE:-publication failed; inspect the workflow run logs}"
          python -m scripts.data_alert failure --result out/alert-result.json

      - name: Close recovered automation alerts
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' || inputs.publish == true) &&
          needs.build-and-verify.result == 'success' &&
          ((needs.build-and-verify.outputs.status == 'no_change' && needs.publish.result == 'skipped') ||
           needs.publish.result == 'success')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.data_alert recovery
