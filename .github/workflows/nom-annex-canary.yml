name: NOM annex canary

on:
  workflow_dispatch:
  schedule:
    # Before the daily data pipeline (11:17 UTC): a failure here means that release would have no NOM.
    - cron: "41 9 * * *"

permissions:
  contents: read

concurrency:
  group: arancel-mx-nom-annex-canary
  cancel-in-progress: false

jobs:
  check-annex:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/production-build.txt

      # The annex reader needs PyMuPDF, which only the maintainer and dev extras install.
      - name: Install exact production runtime with the PDF reader
        run: |
          python -m pip install pip==26.2.2
          python -m pip install -c requirements/production-build.txt -e ".[maintainer]"

      - name: Find, read and check the current Annex 2.4.1
        run: python -m scripts.check_nom_annex
