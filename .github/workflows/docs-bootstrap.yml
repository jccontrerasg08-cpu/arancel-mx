name: Docs bootstrap

on:
  pull_request:
    paths:
      - "website/**"
      - "docs/**"
      - "README.md"
      - "README.en.md"
      - ".github/workflows/docs-bootstrap.yml"

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Generate lockfile without lifecycle scripts
        working-directory: website
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact generated dependency graph
        working-directory: website
        run: npm ci

      - name: Typecheck documentation site
        working-directory: website
        run: npm run typecheck

      - name: Build all locales
        working-directory: website
        run: |
          npm run build
          npm run build -- --locale es
          npm run build -- --locale en

      - name: Upload generated lockfile for reviewed commit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-package-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: website/package-lock.json
          if-no-files-found: error
          retention-days: 3
