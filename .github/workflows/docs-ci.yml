name: Docs CI

on:
  pull_request:
    paths:
      - "website/**"
      - "docs/**"
      - "README.md"
      - "README.en.md"
      - ".github/workflows/docs-ci.yml"
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "docs/**"
      - "README.md"
      - "README.en.md"
      - ".github/workflows/docs-ci.yml"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install exact documentation dependencies
        working-directory: website
        run: npm ci

      - name: Typecheck documentation site
        working-directory: website
        run: npm run typecheck

      - name: Build all configured locales
        working-directory: website
        run: npm run build

      - name: Prove Spanish build independently
        working-directory: website
        run: npm run build -- --locale es

      - name: Prove English build independently
        working-directory: website
        run: npm run build -- --locale en
