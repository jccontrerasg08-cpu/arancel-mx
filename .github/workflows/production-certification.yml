name: Production certification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: false

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/production-build.txt

      - name: Install package and development tools
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -c requirements/production-build.txt -e ".[dev]"

      - name: Run offline test suite
        run: python -m pytest -q

      - name: Build distributions
        run: python -m build

  release-boundary:
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/production-build.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -c requirements/production-build.txt -e .

      - name: Certify temporary release boundary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/certify_github_release.py \
            --result-path out/certification-release.json

      - name: Verify cleanup after release-boundary attempt
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/certify_github_release.py --cleanup-only
