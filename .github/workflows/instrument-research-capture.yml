name: Instrument research capture

# Read-only research capture of primary LIGIE instruments (Diputados ledger,
# DOF daily indexes, SIDOF notes). It never builds, changes or publishes data;
# the only output is a run artifact with the captured bytes and a manifest.

on:
  workflow_dispatch:
    inputs:
      dof_dates:
        description: "Comma-separated ISO dates of DOF editions to scan (e.g. 2026-10-13)"
        required: false
        type: string
        default: ""
      sidof_notes:
        description: "Comma-separated SIDOF note ids"
        required: false
        type: string
        default: ""
      max_documents:
        description: "Maximum documents to download"
        required: false
        type: string
        default: "400"

permissions:
  contents: read

concurrency:
  group: arancel-mx-instrument-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # This job downloads untrusted official documents; keep the token out of .git/config.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/production-build.txt

      - name: Install exact production environment
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -c requirements/production-build.txt -e ".[dev]"

      - name: Capture primary instruments
        env:
          DOF_DATES: ${{ inputs.dof_dates }}
          SIDOF_NOTES: ${{ inputs.sidof_notes }}
          MAX_DOCUMENTS: ${{ inputs.max_documents }}
        run: |
          python scripts/capture_instrument_research.py \
            --out instrument-research \
            --dof-dates "${DOF_DATES}" \
            --sidof-notes "${SIDOF_NOTES}" \
            --max-documents "${MAX_DOCUMENTS}"

      - name: Upload capture
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrument-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: instrument-research/
          if-no-files-found: warn
          retention-days: 90
