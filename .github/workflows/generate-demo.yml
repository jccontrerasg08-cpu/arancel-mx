name: Generate demo animations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push the regenerated documentation branch
      pull-requests: write # open the review pull request for that branch
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The demo branch is pushed with git, which needs the checkout credential.
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install pinned demo dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          npm install -g svg-term-cli@2.1.1

      - name: Generate SVG and GIF assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          CASTS=(docs/*.cast)
          if [ ! -e "${CASTS[0]}" ]; then
            echo "No .cast recordings found in docs; nothing to generate."
            exit 0
          fi
          for f in docs/*.cast; do
            base=$(basename "$f" .cast)
            svg="docs/${base}.svg"
            gif="docs/${base}.gif"
            echo "Converting $f -> $svg"
            svg-term --in "$f" --out "$svg" --window --preserve
            echo "Converting $svg -> $gif"
            convert -background white -flatten "$svg" "$gif"
          done

      - name: Commit changes and open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="automation/demo-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add docs/*.svg docs/*.gif
          git diff --cached --quiet && exit 0
          git commit -m "docs: refresh terminal demo"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "docs: refresh terminal demo" \
            --body "Automated demo refresh from workflow run ${GITHUB_RUN_ID}."
