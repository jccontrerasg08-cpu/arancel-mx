name: Publish Python package

# Package publication is intentionally separate from the data-* GitHub Releases
# that back the public dataset download links. This workflow never creates a
# GitHub Release. It builds the distribution once, publishes those exact bytes
# to TestPyPI, and only for a final (non pre-release) tag, after manual approval
# of the `pypi` environment, publishes the same artifact to PyPI. Uploads use
# Trusted Publishing (OIDC), so no long-lived upload tokens are ever stored.

on:
  push:
    tags:
      - "pkg-v*"

permissions:
  contents: read

concurrency:
  group: publish-python-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      is_prerelease: ${{ steps.validate.outputs.is_prerelease }}
      production_eligible: ${{ steps.validate.outputs.production_eligible }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require the tag to point at the protected main tip
        env:
          TAG_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --depth 1 origin main
          main_sha="$(git rev-parse FETCH_HEAD)"
          if [ "$TAG_SHA" != "$main_sha" ]; then
            echo "package tag commit $TAG_SHA is not the protected main tip $main_sha" >&2
            exit 1
          fi
          echo "package tag matches the protected main tip $main_sha"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Validate tag against project version
        id: validate
        env:
          PACKAGE_TAG: ${{ github.ref_name }}
        run: python scripts/validate_package_tag.py "$PACKAGE_TAG" --github-output

  build-once:
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install build and validation tooling
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -c requirements/production-build.txt build twine
      - name: Build distributions once
        run: python -m build
      - name: Assert distribution version matches the validated tag
        env:
          EXPECTED_VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          test -n "$EXPECTED_VERSION"
          test -f "dist/arancel_mx-${EXPECTED_VERSION}.tar.gz"
          ls dist/arancel_mx-"${EXPECTED_VERSION}"-*.whl
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Record build-once distribution hashes
        working-directory: dist
        run: |
          sha256sum arancel_mx-*.whl arancel_mx-*.tar.gz > SHA256SUMS.package
          cat SHA256SUMS.package
      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    needs: [validate-tag, build-once]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/project/arancel-mx/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download build-once artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist
      - name: Re-verify build-once distribution hashes
        working-directory: dist
        run: |
          sha256sum -c SHA256SUMS.package
          rm -f SHA256SUMS.package
      - name: Publish to TestPyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          print-hash: true

  external-certification-matrix:
    needs: [validate-tag, publish-testpypi]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check out certification helper without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: certification-helper
          sparse-checkout: |
            scripts/certify_testpypi_candidate.py
          sparse-checkout-cone-mode: false
      - name: Install the TestPyPI package without a source checkout
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          python -m pip install pip==26.2.1
          # TestPyPI is trusted only for the candidate. Runtime dependencies must
          # resolve from PyPI so an unrelated TestPyPI project cannot shadow them.
          # Retry on each independent runner until its package-index route can
          # resolve the exact candidate; the helper raises on any final failure.
          python "$GITHUB_WORKSPACE/certification-helper/scripts/certify_testpypi_candidate.py" "$EXPECTED_VERSION" --attempts 40 --delay-seconds 15
      - name: Import the installed version
        env:
          EXPECTED_VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          python -c "import arancel_mx, os; assert arancel_mx.__version__ == os.environ['EXPECTED_VERSION']"
          python -m arancel_mx --help

  publish-pypi:
    needs: [validate-tag, build-once, publish-testpypi, external-certification-matrix]
    if: needs.validate-tag.outputs.production_eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/arancel-mx/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download build-once artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist
      - name: Re-verify build-once distribution hashes
        working-directory: dist
        run: |
          sha256sum -c SHA256SUMS.package
          rm -f SHA256SUMS.package
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          print-hash: true
