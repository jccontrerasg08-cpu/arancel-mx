name: Published bundle canary

on:
  workflow_dispatch:
  schedule:
    - cron: "47 12 * * *"

permissions:
  contents: read

concurrency:
  group: arancel-mx-published-bundle-canary
  cancel-in-progress: false

jobs:
  verify-published-bundle:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/production-build.txt

      - name: Install runtime package without extras
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -c requirements/production-build.txt -e .

      - name: Download and verify the published six-asset bundle
        run: |
          arancel-mx data download
          arancel-mx data verify --bundle

      - name: Retrieve-only suggest against the downloaded dataset
        run: arancel-mx suggest reproductores --offline

      - name: Cite WCO HS 2022 chapter PDF URL without downloading
        run: arancel-mx wco cite 01

      - name: Check deployed public contract
        run: python scripts/check_public_service.py --timeout 20
