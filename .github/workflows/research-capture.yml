name: Research capture (temporary)

# One-off: downloads the official LIGIE 2022 instruments from the Cámara de
# Diputados ledger plus the consolidated text and SNICE workbooks, and commits
# the bytes to this research branch. Never runs on main.
on:
  push:
    branches:
      - research/capture-official-docs

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # commit the captured bytes to this research branch only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -c requirements/production-build.txt -e .
      - name: Capture ledger instruments
        run: python -m scripts.capture_instrument_research --out research-capture --max-documents 200
      - name: Capture consolidated text and SNICE workbooks
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from arancel_mx.sources.http import build_official_session, fetch_official_document
          out = Path("research-capture/extra"); out.mkdir(parents=True, exist_ok=True)
          urls = {
              "LIGIE_2022_consolidada.pdf": ("https://www.diputados.gob.mx/LeyesBiblio/pdf/LIGIE_2022.pdf", ("www.diputados.gob.mx",), ("application/pdf",)),
              "FRACCIONES_20261014.xlsx": ("https://www.snice.gob.mx/~oracle/SNICE_DOCS/FRACCIONESARANCELARIAS-LIGIE_20261014-20261014.xlsx", ("www.snice.gob.mx",), ("application/vnd.openxmlformats-officedocument.spreadsheetml.sheet","application/octet-stream")),
              "NICO_ABRIL24.xlsx": ("https://www.snice.gob.mx/~oracle/SNICE_DOCS/NICO-ABRIL24-LIGIE_20240415-20240415.XLSX", ("www.snice.gob.mx",), ("application/vnd.openxmlformats-officedocument.spreadsheetml.sheet","application/octet-stream")),
          }
          session = build_official_session()
          manifest = {}
          for name, (url, hosts, types) in urls.items():
              try:
                  doc = fetch_official_document(session, url, hosts, types, timeout_s=120)
                  (out / name).write_bytes(doc.content)
                  manifest[name] = {"url": url, "sha256": hashlib.sha256(doc.content).hexdigest(), "bytes": len(doc.content)}
              except Exception as exc:  # research capture: record and continue
                  manifest[name] = {"url": url, "error": f"{type(exc).__name__}: {exc}"}
          (out / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY
      - name: Commit captured bytes to this branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find research-capture -type f -size +95M -print -delete
          git add research-capture
          git commit -q -m "research: captured official LIGIE 2022 documents [skip ci]"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" push -q origin HEAD:research/capture-official-docs
