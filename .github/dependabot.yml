version: 2
updates:
  # "/" covers pyproject.toml (public compatibility ranges); "/requirements" covers
  # production-build.txt, the exact pins every official build and release uses.
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/requirements"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - python
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
    open-pull-requests-limit: 5
