[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arancel-mx"
version = "0.3.6"
description = "CLI y librería Python para consultar, verificar y construir datos arancelarios abiertos de México"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "jccontrerasg08-cpu" },
]
maintainers = [
  { name = "jccontrerasg08-cpu" },
]
keywords = [
  "Mexico",
  "tariff",
  "TIGIE",
  "NICO",
  "HS",
  "customs",
  "trade",
  "DuckDB",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "duckdb>=1.1",
  "fastapi[standard]>=0.141.1",
  "filelock>=3.16",
  "requests>=2.32",
]

[project.optional-dependencies]
operational = [
    "psycopg[binary]>=3.3.4",
]
maintainer = [
    "openpyxl>=3.1",
    "PyMuPDF>=1.24",
    "xlrd>=2.0",
]
dev = [
    "build>=1.2",
    "check-wheel-contents>=0.6.3",
    "httpx2>=2.9.0",
    "mypy>=1.0",
    "openpyxl>=3.1",
    "PyMuPDF>=1.24",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "twine>=6.2",
    "xlrd>=2.0",
]

[project.scripts]
arancel-mx = "arancel_mx.cli:entrypoint"

[project.urls]
Repository = "https://github.com/jccontrerasg08-cpu/arancel-mx"
Issues = "https://github.com/jccontrerasg08-cpu/arancel-mx/issues"
Documentation = "https://github.com/jccontrerasg08-cpu/arancel-mx/tree/main/docs"
Changelog = "https://github.com/jccontrerasg08-cpu/arancel-mx/blob/main/CHANGELOG.md"
"Data Releases" = "https://github.com/jccontrerasg08-cpu/arancel-mx/releases"

[tool.fastapi]
entrypoint = "arancel_mx.api.app:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["arancel_mx*"]

[tool.setuptools.package-data]
arancel_mx = ["api/static/index.html", "api/static/site/index.html", "api/static/site/trade.html", "api/static/site/assets/*", "api/static/site/assets/visuals/*.jpg", "api/static/site/assets/flags/*", "sources/source_registry.json", "py.typed"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
# Keep the baseline focused while enforcing the reviewed Bandit-compatible security rules.
select = ["E9", "E71", "E72", "F63", "F7", "F811", "F82", "W6", "S"]

[tool.ruff.lint.per-file-ignores]
# Closure captured before a later `del`; ruff F821 false-positive on current main.
"tests/consumer/test_upgrade_cache.py" = ["F821"]
# Pytest assertions and controlled local-process fixtures are test contracts, not runtime code.
"tests/**/*.py" = ["S101", "S105", "S107", "S603", "S607", "S108"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
pretty = true
show_error_codes = true
mypy_path = "src"
explicit_package_bases = true
# Existing consumer code is partially typed; do not block the first quality gate
# on arg-type / attr-defined debt in this tooling-only change.
disable_error_code = ["arg-type", "attr-defined"]

[tool.coverage.run]
source_pkgs = ["arancel_mx"]
branch = true

[tool.coverage.report]
fail_under = 87
show_missing = true
skip_covered = true
