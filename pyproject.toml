[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arancel-mx"
version = "0.2.1"
description = "CLI y librería Python para consultar, verificar y construir datos arancelarios abiertos de México"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "jccontrerasg08-cpu" },
]
maintainers = [
  { name = "jccontrerasg08-cpu" },
]
keywords = [
  "Mexico",
  "tariff",
  "TIGIE",
  "NICO",
  "HS",
  "customs",
  "trade",
  "DuckDB",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "duckdb>=1.1",
  "filelock>=3.16",
  "requests>=2.32",
]

[project.optional-dependencies]
maintainer = [
    "openpyxl>=3.1",
    "PyMuPDF>=1.24",
    "xlrd>=2.0",
]
hs = [
    "dspy-ai>=3.2.1,<4.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "httpx>=0.28.1,<0.29.0",
    "beautifulsoup4>=4.15.0,<5.0.0",
    "pypdf>=6.14.2,<7.0.0",
    "bm25s>=0.3.9,<0.4.0",
    "model2vec>=0.8.2,<0.9.0",
    "vicinity>=0.4.4,<0.5.0",
    "rich>=15.0.0,<16.0.0",
]
dev = [
    "build>=1.2",
    "check-wheel-contents>=0.6.3",
    "mypy>=1.0",
    "openpyxl>=3.1",
    "PyMuPDF>=1.24",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "PyYAML>=6.0",
    "reportlab>=4.2",
    "ruff>=0.8",
    "twine>=6.2",
    "xlrd>=2.0",
]

[project.scripts]
arancel-mx = "arancel_mx.cli:entrypoint"
nomenclator = "nomenclator.cli:main"

[project.urls]
Repository = "https://github.com/jccontrerasg08-cpu/arancel-mx"
Issues = "https://github.com/jccontrerasg08-cpu/arancel-mx/issues"
Documentation = "https://github.com/jccontrerasg08-cpu/arancel-mx/tree/main/docs"
Changelog = "https://github.com/jccontrerasg08-cpu/arancel-mx/blob/main/CHANGELOG.md"
"Data Releases" = "https://github.com/jccontrerasg08-cpu/arancel-mx/releases"

[tool.setuptools.packages.find]
where = ["src"]
include = ["arancel_mx*", "nomenclator*"]

[tool.check-wheel-contents]
toplevel = ["arancel_mx", "nomenclator"]

[tool.setuptools.package-data]
arancel_mx = ["sources/source_registry.json", "py.typed"]
nomenclator = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
markers = [
    "integration: live WCO or OpenAI nomenclator tests",
]

[tool.ruff]
target-version = "py311"
src = ["src"]
exclude = [
    "src/nomenclator",
    "tests/nomenclator",
    "third_party",
]

[tool.ruff.lint]
# Keep the first quality gate small enough that current main already passes.
select = ["E9", "E71", "E72", "F63", "F7", "F811", "F82", "W6"]

[tool.ruff.lint.per-file-ignores]
# Closure captured before a later `del`; ruff F821 false-positive on current main.
"tests/consumer/test_upgrade_cache.py" = ["F821"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
pretty = true
show_error_codes = true
mypy_path = "src"
explicit_package_bases = true
# Existing consumer code is partially typed; do not block the first quality gate
# on arg-type / attr-defined debt in this tooling-only change.
disable_error_code = ["arg-type", "attr-defined"]

[tool.coverage.run]
source_pkgs = ["arancel_mx"]
branch = false

[tool.coverage.report]
fail_under = 87
show_missing = true
skip_covered = true
