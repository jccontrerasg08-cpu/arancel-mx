[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "arancel-mx"
version = "0.1.0"
description = "Herramientas abiertas para construir y validar datos arancelarios de México"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "duckdb>=1.1",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "PyMuPDF>=1.24",
  "requests>=2.32",
  "xlrd>=2.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.3",
    "reportlab>=4.2",
]

[project.scripts]
arancel-mx = "arancel_mx.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
include = ["arancel_mx*"]

[tool.setuptools.package-data]
arancel_mx = ["sources/source_registry.json"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
