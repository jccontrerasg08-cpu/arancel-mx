[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arancel-mx"
version = "0.2.0"
description = "CLI y librería Python para consultar, verificar y construir datos arancelarios abiertos de México"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "jccontrerasg08-cpu" },
]
maintainers = [
  { name = "jccontrerasg08-cpu" },
]
keywords = [
  "Mexico",
  "tariff",
  "TIGIE",
  "NICO",
  "HS",
  "customs",
  "trade",
  "DuckDB",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "duckdb>=1.1",
  "filelock>=3.16",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "platformdirs>=4.3",
  "PyMuPDF>=1.24",
  "requests>=2.32",
  "xlrd>=2.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.3",
    "reportlab>=4.2",
]

[project.scripts]
arancel-mx = "arancel_mx.cli:entrypoint"

[project.urls]
Repository = "https://github.com/jccontrerasg08-cpu/arancel-mx"
Issues = "https://github.com/jccontrerasg08-cpu/arancel-mx/issues"
Documentation = "https://github.com/jccontrerasg08-cpu/arancel-mx/tree/main/docs"
Changelog = "https://github.com/jccontrerasg08-cpu/arancel-mx/blob/main/CHANGELOG.md"
"Data Releases" = "https://github.com/jccontrerasg08-cpu/arancel-mx/releases"

[tool.setuptools.packages.find]
where = ["src"]
include = ["arancel_mx*"]

[tool.setuptools.package-data]
arancel_mx = ["sources/source_registry.json"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
