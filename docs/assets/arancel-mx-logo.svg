<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">arancel.mx</title>
  <desc id="desc">Horizontal arancel.mx logo with a dimensional customs lock, document, green verification mark, Mexican green and red trade panels, and green code brackets.</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12386c"/>
      <stop offset="0.5" stop-color="#08285a"/>
      <stop offset="1" stop-color="#001c49"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00a876"/>
      <stop offset="1" stop-color="#007a50"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff1738"/>
      <stop offset="1" stop-color="#c90022"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e8eef5"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbe5f0"/>
      <stop offset="1" stop-color="#bac8d9"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#092d63"/>
      <stop offset="1" stop-color="#001c49"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#00142f" flood-opacity="0.22"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#00142f" flood-opacity="0.18"/>
    </filter>
    <style>
      .word{font-family:Arial,Helvetica,sans-serif;font-size:142px;font-weight:800;letter-spacing:-6px}
    </style>
  </defs>

  <g transform="translate(25 30)" filter="url(#shadow)">
    <path d="M78 82V55C78 22 101 3 132 3s54 19 54 52v27" fill="none" stroke="url(#navy)" stroke-width="31" stroke-linecap="round"/>
    <rect x="43" y="72" width="181" height="177" rx="24" fill="url(#navy)"/>
    <path d="M11 116 59 96v117L11 195Z" fill="url(#green)"/>
    <path d="M256 116 208 96v117l48-18Z" fill="url(#red)"/>
    <g stroke="#fff" stroke-width="6" stroke-linecap="round" opacity="0.96">
      <path d="M27 132v55M42 126v66"/>
      <path d="M225 126v66M241 132v55"/>
    </g>
    <path d="M72 92h106l34 34v99c0 8-7 15-15 15H87c-8 0-15-7-15-15Z" fill="url(#paper)" filter="url(#softShadow)"/>
    <path d="M178 92v24c0 10 8 18 18 18h16Z" fill="url(#fold)"/>
    <rect x="96" y="128" width="73" height="17" rx="4" fill="#06275a"/>
    <rect x="96" y="158" width="85" height="11" rx="4" fill="#bac9da"/>
    <rect x="96" y="181" width="52" height="11" rx="4" fill="#c6d2df"/>
    <path d="M5 208h94l28 35H37Z" fill="#06275a"/>
    <rect x="28" y="220" width="59" height="7" rx="4" fill="#fff"/>
    <circle cx="176" cy="207" r="34" fill="url(#green)" stroke="#fff" stroke-width="8" filter="url(#softShadow)"/>
    <path d="m158 207 12 12 25-29" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M347 68h-27v185h27" fill="none" stroke="url(#green)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="382" y="211" class="word" fill="url(#word)">arancel</text>
  <circle cx="901" cy="188" r="18" fill="url(#green)"/>
  <text x="929" y="211" class="word" fill="url(#word)">mx</text>
  <path d="M1158 68h27v185h-27" fill="none" stroke="url(#green)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>