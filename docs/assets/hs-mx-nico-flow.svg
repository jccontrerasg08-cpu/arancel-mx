<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">HS to Mexican tariff fraction and NICO</title>
  <desc id="desc">Conceptual hierarchy from six-digit HS to eight-digit Mexican tariff fraction and a ten-digit Mexican identifier with NICO.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1321"/>
      <stop offset="1" stop-color="#132b3a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8fb3c9"/>
    </marker>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <text x="600" y="48" text-anchor="middle" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Jerarquía conceptual de clasificación</text>
  <text x="600" y="76" text-anchor="middle" fill="#9fb6c5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">HS 6 → fracción mexicana 8 → NICO +2 → identificador mexicano 10</text>

  <g transform="translate(55 120)">
    <rect width="240" height="150" rx="20" fill="#102536" stroke="#4b7591" stroke-opacity="0.65"/>
    <text x="120" y="38" text-anchor="middle" fill="#89a9bd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1">NIVEL 1</text>
    <text x="120" y="80" text-anchor="middle" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800">HS</text>
    <text x="120" y="112" text-anchor="middle" fill="#c8d7df" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">6 dígitos</text>
    <text x="120" y="136" text-anchor="middle" fill="#7d97a7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">base internacional</text>
  </g>

  <line x1="310" y1="195" x2="410" y2="195" stroke="#8fb3c9" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(430 120)">
    <rect width="300" height="150" rx="20" fill="#0f2c2c" stroke="#00c389" stroke-opacity="0.55"/>
    <text x="150" y="38" text-anchor="middle" fill="#6dd9b4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1">NIVEL 2</text>
    <text x="150" y="79" text-anchor="middle" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="800">Fracción MX</text>
    <text x="150" y="112" text-anchor="middle" fill="#c8d7df" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">8 dígitos</text>
    <text x="150" y="136" text-anchor="middle" fill="#7fb8a5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">clasificación mexicana</text>
  </g>

  <line x1="745" y1="195" x2="830" y2="195" stroke="#8fb3c9" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(850 120)">
    <rect width="295" height="150" rx="20" fill="#2c2421" stroke="#ff8b72" stroke-opacity="0.58"/>
    <text x="147.5" y="38" text-anchor="middle" fill="#ffb09d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1">NIVEL 3</text>
    <text x="147.5" y="79" text-anchor="middle" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="800">NICO + 2</text>
    <text x="147.5" y="112" text-anchor="middle" fill="#c8d7df" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">10 dígitos totales</text>
    <text x="147.5" y="136" text-anchor="middle" fill="#c99b8e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">identificación comercial</text>
  </g>

  <text x="600" y="322" text-anchor="middle" fill="#8aa2b1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">La relación concreta entre niveles debe conservar trazabilidad hacia la evidencia oficial correspondiente.</text>
</svg>
