<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">arancel-mx data pipeline</title>
  <desc id="desc">Official Mexican sources flow through discovery, capture, parsing, normalization, validation, reconciliation, DuckDB, and reproducible release artifacts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08131f"/>
      <stop offset="1" stop-color="#102a3a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0L0 6L9 3Z" fill="#7997a9"/>
    </marker>
  </defs>
  <rect width="1200" height="640" rx="26" fill="url(#bg)"/>
  <text x="600" y="48" text-anchor="middle" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800">Fuentes oficiales → datos reproducibles</text>
  <text x="600" y="76" text-anchor="middle" fill="#94adbc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Cada etapa conserva una responsabilidad clara y auditable.</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(85 110)">
      <rect width="190" height="74" rx="16" fill="#102536" stroke="#5c7d92"/>
      <text x="95" y="31" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">DOF</text>
      <text x="95" y="54" text-anchor="middle" fill="#8fa8b8" font-size="12">publicaciones oficiales</text>
    </g>
    <g transform="translate(320 110)">
      <rect width="190" height="74" rx="16" fill="#102536" stroke="#5c7d92"/>
      <text x="95" y="31" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">SNICE</text>
      <text x="95" y="54" text-anchor="middle" fill="#8fa8b8" font-size="12">LIGIE · NICO · notas</text>
    </g>
    <g transform="translate(555 110)">
      <rect width="260" height="74" rx="16" fill="#102536" stroke="#5c7d92"/>
      <text x="130" y="31" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">Cámara de Diputados</text>
      <text x="130" y="54" text-anchor="middle" fill="#8fa8b8" font-size="12">referencia LIGIE</text>
    </g>

    <line x1="180" y1="196" x2="180" y2="228" stroke="#7997a9" stroke-width="2"/>
    <line x1="415" y1="196" x2="415" y2="228" stroke="#7997a9" stroke-width="2"/>
    <line x1="685" y1="196" x2="685" y2="228" stroke="#7997a9" stroke-width="2"/>
    <line x1="180" y1="228" x2="685" y2="228" stroke="#7997a9" stroke-width="2"/>
    <line x1="432" y1="228" x2="432" y2="254" stroke="#7997a9" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(270 268)">
      <rect width="325" height="72" rx="16" fill="#0d2a28" stroke="#00c389" stroke-opacity="0.7"/>
      <text x="162.5" y="29" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">Discovery + Capture</text>
      <text x="162.5" y="52" text-anchor="middle" fill="#88cdb8" font-size="12">URL · evidencia · documento · SHA256</text>
    </g>

    <line x1="432" y1="340" x2="432" y2="370" stroke="#7997a9" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(70 388)">
      <rect width="185" height="72" rx="16" fill="#172239" stroke="#5f8cff" stroke-opacity="0.7"/>
      <text x="92.5" y="29" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Parser</text>
      <text x="92.5" y="51" text-anchor="middle" fill="#aab8ee" font-size="12">XLS · XLSX · PDF</text>
    </g>
    <line x1="255" y1="424" x2="294" y2="424" stroke="#7997a9" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(310 388)">
      <rect width="185" height="72" rx="16" fill="#172239" stroke="#5f8cff" stroke-opacity="0.7"/>
      <text x="92.5" y="29" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Normalización</text>
      <text x="92.5" y="51" text-anchor="middle" fill="#aab8ee" font-size="12">códigos · tasas</text>
    </g>
    <line x1="495" y1="424" x2="534" y2="424" stroke="#7997a9" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(550 388)">
      <rect width="185" height="72" rx="16" fill="#172239" stroke="#5f8cff" stroke-opacity="0.7"/>
      <text x="92.5" y="29" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Validación</text>
      <text x="92.5" y="51" text-anchor="middle" fill="#aab8ee" font-size="12">reglas · consistencia</text>
    </g>
    <line x1="735" y1="424" x2="774" y2="424" stroke="#7997a9" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(790 388)">
      <rect width="185" height="72" rx="16" fill="#172239" stroke="#5f8cff" stroke-opacity="0.7"/>
      <text x="92.5" y="29" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Reconciliación</text>
      <text x="92.5" y="51" text-anchor="middle" fill="#aab8ee" font-size="12">evidencia legal</text>
    </g>

    <line x1="975" y1="424" x2="1015" y2="424" stroke="#7997a9" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(1030 388)">
      <rect width="105" height="72" rx="16" fill="#2b2914" stroke="#fff000" stroke-opacity="0.65"/>
      <text x="52.5" y="30" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">DuckDB</text>
      <text x="52.5" y="52" text-anchor="middle" fill="#ddd58a" font-size="11">núcleo analítico</text>
    </g>

    <line x1="1082" y1="460" x2="1082" y2="500" stroke="#7997a9" stroke-width="2"/>
    <line x1="690" y1="500" x2="1082" y2="500" stroke="#7997a9" stroke-width="2"/>

    <g transform="translate(650 520)">
      <rect width="115" height="58" rx="14" fill="#132838" stroke="#4f748a"/>
      <text x="57.5" y="35" text-anchor="middle" fill="#dce8ef" font-size="15" font-weight="700">CSV</text>
    </g>
    <g transform="translate(785 520)">
      <rect width="115" height="58" rx="14" fill="#132838" stroke="#4f748a"/>
      <text x="57.5" y="35" text-anchor="middle" fill="#dce8ef" font-size="15" font-weight="700">JSON</text>
    </g>
    <g transform="translate(920 520)">
      <rect width="150" height="58" rx="14" fill="#132838" stroke="#4f748a"/>
      <text x="75" y="35" text-anchor="middle" fill="#dce8ef" font-size="15" font-weight="700">manifest.json</text>
    </g>
    <g transform="translate(1090 520)">
      <rect width="80" height="58" rx="14" fill="#2c2421" stroke="#ff8b72"/>
      <text x="40" y="35" text-anchor="middle" fill="#ffd0c5" font-size="14" font-weight="700">Release</text>
    </g>
  </g>

  <text x="82" y="600" fill="#7f99a9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Objetivo: evidencia verificable + transformación determinista + artefactos reproducibles.</text>
</svg>
