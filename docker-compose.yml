services:
  dashboard:
    build: .
    container_name: comercio-exterior-dashboard
    ports:
      - "${PORT:-8050}:7860"
    environment:
      PORT: "7860"
      BANXICO_TOKEN: "${BANXICO_TOKEN:-}"
      LIVE_REFRESH_SECONDS: "${LIVE_REFRESH_SECONDS:-900}"
      DOF_LOOKBACK_DAYS: "${DOF_LOOKBACK_DAYS:-14}"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-1}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-120}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_MODEL: "${GROQ_MODEL:-llama-3.3-70b-versatile}"
      GROQ_MAX_COMPLETION_TOKENS: "${GROQ_MAX_COMPLETION_TOKENS:-1024}"
      GROQ_TEMPERATURE: "${GROQ_TEMPERATURE:-0.35}"
      GROQ_TOP_P: "${GROQ_TOP_P:-1}"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  refresh-sie:
    build: .
    profiles: ["tools"]
    command: python banxico_sie.py
    environment:
      BANXICO_TOKEN: "${BANXICO_TOKEN:-}"
    volumes:
      - ./data:/app/data
    restart: "no"

  refresh-anam:
    build: .
    profiles: ["tools"]
    command: python integrar_recaudacion_anam.py
    volumes:
      - ./data:/app/data
    restart: "no"

  comex-init:
    build: .
    profiles: ["tools"]
    command: python comex.py init-db
    volumes:
      - ./data:/app/data
    restart: "no"

  comex-etl:
    build: .
    profiles: ["tools"]
    command: python comex.py etl run
    environment:
      DOF_LOOKBACK_DAYS: "${DOF_LOOKBACK_DAYS:-14}"
    volumes:
      - ./data:/app/data
    restart: "no"

  comex-watch:
    build: .
    profiles: ["tools"]
    command: python comex.py watch run --dry-run
    volumes:
      - ./data:/app/data
    restart: "no"
