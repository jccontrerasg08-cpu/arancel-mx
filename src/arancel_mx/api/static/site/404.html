<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Página no encontrada — arancel.mx</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: light dark; --ink: #102a43; --muted: #61707c; --surface: #fbfcfd; --panel: #fff; --line: #dbe4e8; --brand: #008a5b; }
      @media (prefers-color-scheme: dark) { :root { --ink: #e8f0f4; --muted: #b7c5cd; --surface: #0b1b26; --panel: #112937; --line: #274353; --brand: #67c6df; } }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 1.5rem; background: var(--surface); color: var(--ink); font-family: "DM Sans", system-ui, sans-serif; line-height: 1.55; }
      main { width: min(34rem, 100%); }
      img { width: 10.85rem; height: auto; margin-bottom: 2rem; padding: .22rem .42rem; border-radius: .55rem; background: #f6fafb; }
      .code { margin: 0; color: var(--brand); font: 500 .8rem "DM Mono", ui-monospace, monospace; letter-spacing: .1em; text-transform: uppercase; }
      h1 { max-width: 18ch; margin: .4rem 0 .8rem; font-family: "Fredoka", "DM Sans", sans-serif; font-size: clamp(2.2rem, 8vw, 3.4rem); font-weight: 600; letter-spacing: -.03em; line-height: 1.05; text-wrap: balance; }
      p { color: var(--muted); }
      nav { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.6rem; }
      a { display: inline-flex; align-items: center; min-height: 2.7rem; padding: .6rem .95rem; border: 1px solid var(--line); border-radius: .55rem; background: var(--panel); color: var(--ink); font-weight: 700; text-decoration: none; }
      a.primary { border-color: var(--brand); background: var(--brand); color: #fff; }
      a:hover { border-color: var(--brand); }
      @media (prefers-color-scheme: dark) { a.primary { color: #0b1b26; } }
      a:focus-visible { outline: 3px solid #a56b00; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/arancel-mx-logo.svg" alt="arancel.mx" />
      <p class="code">Error 404</p>
      <h1>Esta página no existe.</h1>
      <p>La dirección que abriste no es una página pública de arancel.mx. Puede que haya cambiado o que tenga un error de escritura.</p>
      <nav aria-label="Rutas útiles">
        <a class="primary" href="/">Ir al inicio</a>
        <a href="/app">Buscar una fracción</a>
        <a href="/data">Ver las cifras</a>
        <a href="/documentation">Documentación</a>
      </nav>
    </main>
  </body>
</html>
